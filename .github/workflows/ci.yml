name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      APP_ENV: development
      BASE_URL: http://testserver
      DATABASE_URL: postgresql+asyncpg://contactsafe:contactsafe@localhost:5432/contactsafe
      TOKEN_ENCRYPTION_KEY: 9778OHyv3r55s_4Ic9RbMmqy4kNZopoiWROkezHGqig=
      SESSION_SECRET: ci-test-session-secret-for-pytest-only
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_REDIRECT_URI: http://testserver/oauth/callback

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PostgreSQL
        run: |
          set -euo pipefail
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16 postgresql-16-pgvector

          sudo systemctl start postgresql

          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'contactsafe') THEN
              CREATE ROLE contactsafe LOGIN PASSWORD 'contactsafe' CREATEDB SUPERUSER;
            END IF;
          END
          $$;
          SELECT 'CREATE DATABASE contactsafe OWNER contactsafe'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'contactsafe')\gexec
          \c contactsafe
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          SQL

          PG_HBA="/etc/postgresql/16/main/pg_hba.conf"
          PG_CONF="/etc/postgresql/16/main/postgresql.conf"
          if ! grep -q '127.0.0.1/32' "$PG_HBA"; then
            echo "host all all 127.0.0.1/32 scram-sha-256" | sudo tee -a "$PG_HBA"
            echo "host all all ::1/128 scram-sha-256" | sudo tee -a "$PG_HBA"
          fi
          sudo sed -i "s/#listen_addresses = 'localhost'/listen_addresses = 'localhost'/" "$PG_CONF"
          sudo systemctl restart postgresql

          for i in $(seq 1 30); do
            if PGPASSWORD=contactsafe pg_isready -h 127.0.0.1 -p 5432 -U contactsafe -d contactsafe; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL failed to become ready"
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --extra dev

      - name: Run migrations
        run: uv run --package contactsafe-server alembic -c migrations/alembic.ini upgrade head

      - name: Run tests
        run: uv run --package contactsafe-server --extra dev pytest packages/server/tests --cov --cov-report=term-missing -q
