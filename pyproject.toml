[project]
name = "contactsafe"
version = "0.1.0"
description = "Agent-native personal graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/core", "packages/server"]

[tool.uv]
dev-dependencies = [
    "pyright>=1.1.400",
    "ruff>=0.9.0",
]

[tool.pyright]
include = ["packages"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
