# Postgres is optional when using Supabase. Start it with: docker compose --profile local-db up -d
services:
  postgres:
    profiles: ["local-db"]
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: contactsafe
      POSTGRES_PASSWORD: contactsafe
      POSTGRES_DB: contactsafe
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contactsafe -d contactsafe"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    build: .
    command: uv run --package contactsafe-server arq contactsafe_server.worker.WorkerSettings
    depends_on:
      - redis
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      USE_ARQ_WORKER: "true"

volumes:
  postgres_data:
  redis_data:
