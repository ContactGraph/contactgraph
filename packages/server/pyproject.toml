[project]
name = "contactsafe-server"
version = "0.1.0"
description = "ContactGraph MCP server and OAuth API"
requires-python = ">=3.12"
dependencies = [
    "contactsafe-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "mcp>=1.27.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "authlib>=1.4.0",
    "httpx>=0.28.0",
    "cryptography>=44.0.0",
    "jinja2>=3.1.0",
    "certifi>=2026.5.20",
    "pgvector>=0.3.6",
]

[project.scripts]
contactsafe-server = "contactsafe_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contactsafe_server"]

[tool.uv.sources]
contactsafe-core = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
